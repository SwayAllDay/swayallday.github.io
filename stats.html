<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZOYA | Website stats</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="Favicon.png">
  <style>
    :root { --ink: #050505; --card: #0d0d0d; --text: #fff; --muted: rgba(255,255,255,0.55); --line: rgba(255,255,255,0.12); --accent: #2ed3f0; }
    * { box-sizing: border-box; margin: 0; }
    body { background: var(--ink); color: var(--text); font-family: Arial, Helvetica, sans-serif; line-height: 1.5; min-height: 100vh; }
    .wrap { max-width: 980px; margin: 0 auto; padding: 48px 20px 80px; }
    .logo { font-size: 26px; font-weight: 800; letter-spacing: 8px; }
    h1 { font-size: 11px; font-weight: 800; letter-spacing: 4px; text-transform: uppercase; color: var(--muted); margin: 10px 0 40px; }
    h2 { font-size: 11px; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); margin-bottom: 16px; }

    .gate { display: flex; flex-wrap: wrap; gap: 10px; max-width: 460px; }
    .gate label { width: 100%; font-size: 11px; letter-spacing: 2.4px; text-transform: uppercase; color: var(--muted); }
    .gate input { flex: 1; min-width: 180px; padding: 14px 16px; border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit; }
    .gate input:focus-visible, button:focus-visible { outline: 1px solid #fff; outline-offset: 3px; }
    .gate button { padding: 14px 24px; border: 0; background: #fff; color: #050505; font: inherit; font-size: 11px; font-weight: 800; letter-spacing: 2.6px; text-transform: uppercase; cursor: pointer; }
    .gate__error { width: 100%; color: #ff8a8a; font-size: 13px; }

    .rangebar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 32px; }
    .range { display: flex; gap: 8px; }
    .range button { padding: 9px 16px; border: 1px solid var(--line); background: none; color: var(--muted); font: inherit; font-size: 10px; font-weight: 800; letter-spacing: 2.2px; text-transform: uppercase; cursor: pointer; }
    .range button.is-active { background: #fff; color: #050505; border-color: #fff; }
    .signout { background: none; border: 0; color: var(--muted); font: inherit; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; text-decoration: underline; text-underline-offset: 4px; cursor: pointer; }

    .status { padding: 40px 0; text-align: center; color: var(--muted); }
    .status.is-error { color: #ff8a8a; }

    .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 40px; }
    .card { padding: 20px 18px; border: 1px solid var(--line); background: var(--card); }
    .card__num { font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .card__label { margin-top: 4px; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px 48px; }
    .block--wide { grid-column: 1 / -1; }
    .rows { display: flex; flex-direction: column; gap: 10px; }
    .row { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 14px; }
    .row__name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row__count { color: var(--muted); font-variant-numeric: tabular-nums; }
    .row__bar-wrap { grid-column: 1 / -1; height: 3px; background: rgba(255,255,255,0.08); }
    .row__bar { display: block; height: 100%; background: #fff; }
    .empty { color: var(--muted); font-size: 13px; }

    .days { display: flex; align-items: flex-end; gap: 3px; height: 140px; border-bottom: 1px solid var(--line); }
    .days .bar { flex: 1; min-height: 2px; background: var(--accent); position: relative; }
    .days .bar:hover { background: #fff; }
    .days .bar:hover::after { content: attr(data-label); position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%); padding: 4px 8px; background: var(--card); border: 1px solid var(--line); font-size: 11px; white-space: nowrap; }

    @media (max-width: 720px) {
      .cards { grid-template-columns: repeat(2, 1fr); }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <p class="logo">ZOYA</p>
    <h1>Website stats</h1>

    <form id="gate" class="gate">
      <label for="key">Password</label>
      <input id="key" type="password" autocomplete="current-password" placeholder="Enter password">
      <button type="submit">View</button>
      <p class="gate__error" id="gateError" hidden></p>
    </form>

    <div id="dash" hidden>
      <div class="rangebar">
        <div class="range" id="range">
          <button data-days="7">7 days</button>
          <button data-days="30" class="is-active">30 days</button>
          <button data-days="90">90 days</button>
        </div>
        <button id="signOut" class="signout">Sign out</button>
      </div>

      <p id="status" class="status">Loading…</p>

      <div id="content" hidden>
        <div class="cards">
          <div class="card"><div class="card__num" id="numViews">–</div><div class="card__label">Page views</div></div>
          <div class="card"><div class="card__num" id="numClicks">–</div><div class="card__label">Clicks</div></div>
          <div class="card"><div class="card__num" id="numSignups">–</div><div class="card__label">Download signups</div></div>
          <div class="card"><div class="card__num" id="numPlays">–</div><div class="card__label">Preview plays</div></div>
        </div>

        <div class="grid">
          <section class="block--wide"><h2>Views per day</h2><div id="daily" class="days"></div></section>
          <section><h2>Most-viewed pages</h2><div id="pages" class="rows"></div></section>
          <section><h2>Where visitors come from</h2><div id="referrers" class="rows"></div></section>
          <section><h2>Top countries</h2><div id="countries" class="rows"></div></section>
          <section><h2>Device</h2><div id="devices" class="rows"></div></section>
          <section><h2>Releases opened</h2><div id="releases" class="rows"></div></section>
          <section><h2>Listen-on clicks, by platform</h2><div id="platforms" class="rows"></div></section>
          <section><h2>Social icon clicks</h2><div id="socials" class="rows"></div></section>
          <section><h2>Campaigns (utm_source)</h2><div id="campaigns" class="rows"></div></section>
          <section class="block--wide"><h2>Links to other websites</h2><div id="outbound" class="rows"></div></section>
        </div>
      </div>
    </div>
  </main>

  <script>
  (function () {
    "use strict";
    var $ = function (s) { return document.querySelector(s); };
    var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };

    // Kept only in sessionStorage: gone when the tab closes.
    var KEY = "zoya_site_stats_key";
    var days = 30;
    var PAGE_NAMES = { "/": "Home", "/events.html": "Events", "/merch.html": "Merch", "/contact.html": "Contact", "/demo.html": "Send Promo / Demo", "/privacy.html": "Privacy", "/terms.html": "Terms", "/cookies.html": "Cookies" };
    var DEVICE_NAMES = { mobile: "Mobile", desktop: "Desktop" };

    function status(msg, isError) {
      var el = $("#status");
      el.hidden = !msg;
      el.textContent = msg || "";
      el.classList.toggle("is-error", !!isError);
    }

    function showGate(msg) {
      sessionStorage.removeItem(KEY);
      $("#dash").hidden = true;
      $("#gate").hidden = false;
      $("#gateError").hidden = !msg;
      $("#gateError").textContent = msg || "";
    }

    function rows(list, rename) {
      if (!list || !list.length) return '<p class="empty">Nothing yet in this period.</p>';
      var top = Math.max.apply(null, list.map(function (r) { return Number(r.count) || 0; }).concat(1));
      return list.map(function (r) {
        var v = Number(r.count) || 0;
        var name = (rename && rename[r.name]) || r.name || "(unknown)";
        return '<div class="row"><span class="row__name">' + esc(name) + '</span><span class="row__count">' + v.toLocaleString() +
          '</span><span class="row__bar-wrap"><span class="row__bar" style="width:' + Math.max(2, Math.round(v / top * 100)) + '%"></span></span></div>';
      }).join("");
    }

    function render(d) {
      $("#numViews").textContent = (d.pageviews || 0).toLocaleString();
      $("#numClicks").textContent = (d.clicks || 0).toLocaleString();
      $("#numSignups").textContent = (d.signups || 0).toLocaleString();
      $("#numPlays").textContent = (d.previewPlays || 0).toLocaleString();

      var daily = d.daily || [];
      var max = Math.max.apply(null, daily.map(function (x) { return Number(x.count) || 0; }).concat(1));
      $("#daily").innerHTML = daily.map(function (x) {
        var v = Number(x.count) || 0;
        return '<div class="bar" style="height:' + Math.max(2, Math.round(v / max * 100)) + '%" data-label="' + esc(x.day + ": " + v) + '"></div>';
      }).join("") || '<p class="empty">No views yet in this period.</p>';

      $("#pages").innerHTML = rows(d.pages, PAGE_NAMES);
      $("#referrers").innerHTML = rows(d.referrers);
      $("#countries").innerHTML = rows(d.countries);
      $("#devices").innerHTML = rows(d.devices, DEVICE_NAMES);
      $("#releases").innerHTML = rows(d.releases);
      $("#platforms").innerHTML = rows(d.platforms);
      $("#socials").innerHTML = rows(d.socials);
      $("#campaigns").innerHTML = rows(d.campaigns);
      $("#outbound").innerHTML = rows(d.outbound);
      $("#content").hidden = false;
    }

    function load(key) {
      $("#gate").hidden = true;
      $("#dash").hidden = false;
      $("#content").hidden = true;
      status("Loading…");

      fetch("/api/stats?days=" + days, { headers: { "X-Stats-Key": key } })
        .then(function (res) { return res.json().then(function (data) { return { res: res, data: data }; }); })
        .then(function (r) {
          if (r.res.status === 401) return showGate(r.data.error || "Wrong password.");
          if (!r.res.ok) return status(r.data.error || "Something went wrong loading stats.", true);
          sessionStorage.setItem(KEY, key);
          status("");
          render(r.data);
        })
        .catch(function () { status("Could not reach the stats service. Is the analytics Worker deployed?", true); });
    }

    $("#gate").addEventListener("submit", function (e) {
      e.preventDefault();
      var key = $("#key").value.trim();
      if (key) load(key);
    });
    $("#signOut").addEventListener("click", function () { showGate(""); $("#key").value = ""; $("#key").focus(); });
    $("#range").addEventListener("click", function (e) {
      var btn = e.target.closest("button[data-days]");
      if (!btn) return;
      days = Number(btn.dataset.days);
      document.querySelectorAll("#range button").forEach(function (b) { b.classList.toggle("is-active", b === btn); });
      var key = sessionStorage.getItem(KEY);
      if (key) load(key);
    });

    var saved = sessionStorage.getItem(KEY);
    if (saved) load(saved);
  })();
  </script>
</body>
</html>
